<!doctype html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>Glutentjek</title>
    <meta
      name="description"
      content="Scan stregkoden på en madvare og se om den indeholder gluten. Alt data bliver på enheden."
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#F2F4F7" />
    <link rel="icon" href="/icons/icon-192.png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Glutentjek" />
    <meta name="referrer" content="no-referrer" />
    <script>
      (function () {
        try {
          var key = 'soelleaki-theme';
          var stored = localStorage.getItem(key);
          var theme =
            stored === 'dark' || stored === 'light'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.style.colorScheme = theme;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', theme === 'dark' ? '#0C0E12' : '#F2F4F7');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Glutentjek kræver JavaScript for at kunne læse stregkoder.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
